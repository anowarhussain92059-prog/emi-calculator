+<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        /* Error Screen */
        #offline-screen {
            display: none;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            padding: 20px;
            border-radius: 12px;
        }

        .error-title {
            color: #ef4444;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .retry-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        /* Inputs */
        label { font-size: 14px; color: #94a3b8; display: block; margin-top: 12px; text-align: left; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #facc15;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            margin-top: 6px;
        }

        .reset-btn {
            background: #334155;
            color: #94a3b8;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            margin-top: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .result-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 16px;
            border-left: 4px solid #f59e0b;
            text-align: left;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .result-row.total {
            font-size: 16px;
            font-weight: bold;
            color: #22c55e;
            border-top: 1px solid #334155;
            padding-top: 8px;
            margin-bottom: 0;
        }

        /* Ad Box */
        .ad-container {
            margin-top: 20px;
            padding: 12px;
            background: #0f172a;
            border: 1px dashed #334155;
            border-radius: 8px;
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
</style>

<title>EMI Calculator</title>
<link rel="icon" href="https://fav.farm/🏦" />
<link rel="apple-touch-icon" href="https://fav.farm/🏦" />

</head>
 
    
<body>

    <div class="card">

        <!-- NO INTERNET SCREEN -->
        <div id="offline-screen">
            <div class="error-box">
                <div style="font-size:48px; margin-bottom:10px;">📡❌</div>
                <div class="error-title">No Internet Connection</div>
                <p style="color: #94a3b8; font-size: 13px; margin: 0;">Please check your network connection to use this app.</p>
                <button class="retry-btn" onclick="checkInternet()">Retry Connection 🔄</button>
            </div>
        </div>

        <!-- MAIN APP SCREEN -->
        <div id="app-screen">
            <h2 style="color: #38bdf8; margin-top:0;">🏦 Loan EMI Calc</h2>
            
            <label>Loan Amount (₹):</label>
            <input type="text" id="amount" placeholder="e.g. 100000" oninput="calculateEMI()">

            <label>Interest Rate (%):</label>
            <input type="text" id="interest" placeholder="e.g. 10.5" oninput="calculateEMI()">

            <label>Tenure (Years):</label>
            <input type="text" id="years" placeholder="e.g. 2" oninput="calculateEMI()">

            <button class="reset-btn" onclick="resetForm()">Reset / Clear 🔄</button>

            <div class="result-box">
                <div class="result-row">
                    <span>Monthly EMI:</span>
                    <span id="emi" style="color:#38bdf8; font-weight:bold;">₹0.00</span>
                </div>
                <div class="result-row">
                    <span>Total Interest:</span>
                    <span id="totalInterest" style="color:#ef4444; font-weight:bold;">₹0.00</span>
                </div>
                <div class="result-row total">
                    <span>Total Payable:</span>
                    <span id="totalPayable">₹0.00</span>
                </div>
            </div>

            <!-- AD CONTAINER -->
            <div class="ad-container" id="ad-space">
                📢 ADVERTISEMENT
            </div>
        </div>

    </div>

    <script>
        function checkInternet() {
            let appScreen = document.getElementById('app-screen');
            let offlineScreen = document.getElementById('offline-screen');

            if (navigator.onLine) {
                appScreen.style.display = 'block';
                offlineScreen.style.display = 'none';
            } else {
                appScreen.style.display = 'none';
                offlineScreen.style.display = 'block';
            }
        }

        function calculateEMI() {
            let p = parseFloat(document.getElementById('amount').value);
            let r = parseFloat(document.getElementById('interest').value);
            let n = parseFloat(document.getElementById('years').value);

            if (isNaN(p) || isNaN(r) || isNaN(n) || p <= 0 || r <= 0 || n <= 0) {
                document.getElementById('emi').innerText = "₹0.00";
                document.getElementById('totalInterest').innerText = "₹0.00";
                document.getElementById('totalPayable').innerText = "₹0.00";
                return;
            }

            let monthlyInterest = r / 12 / 100;
            let totalMonths = n * 12;

            let emiValue = (p * monthlyInterest * Math.pow(1 + monthlyInterest, totalMonths)) / 
                           (Math.pow(1 + monthlyInterest, totalMonths) - 1);

            let totalPayableValue = emiValue * totalMonths;
            let totalInterestValue = totalPayableValue - p;

            document.getElementById('emi').innerText = "₹" + emiValue.toFixed(2);
            document.getElementById('totalInterest').innerText = "₹" + totalInterestValue.toFixed(2);
            document.getElementById('totalPayable').innerText = "₹" + totalPayableValue.toFixed(2);
        }

        function resetForm() {
            document.getElementById('amount').value = '';
            document.getElementById('interest').value = '';
            document.getElementById('years').value = '';
            calculateEMI();
        }

        window.addEventListener('online', checkInternet);
        window.addEventListener('offline', checkInternet);

        checkInternet();
    </script>

</body>
</html>
